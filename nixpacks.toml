[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "libglvnd", "glib", "xorg.libxcb", "xorg.libX11", "xorg.libXext", "xorg.libXrender", "xorg.libICE", "xorg.libSM"]

[phases.build]
cmds = [
  "npm install",
  "pip install --break-system-packages -r requirements.txt",
  "pip uninstall -y opencv-python opencv-python-headless",
  "pip install --break-system-packages opencv-python-headless",
  "npx prisma generate"
]

[start]
cmd = "npx prisma db push && node prisma/seed.js && node src/server.js"
