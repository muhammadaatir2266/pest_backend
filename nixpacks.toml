[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "libglvnd", "glib", "xorg.libxcb"]

[phases.build]
cmds = ["npm install", "pip install --break-system-packages -r requirements.txt", "npx prisma generate"]

[start]
cmd = "npx prisma db push && node prisma/seed.js && node src/server.js"

